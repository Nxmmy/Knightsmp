name: ModsForKnightSMP
prefix: Mods For KnightSMP
version: '${version}'
main: dev.knightsmp.mods.KnightPlugin
api-version: '26.3'
authors: [KnightSMP]
description: KnightSMP all-in-one plugin - Dollar economy, shops, kits, market, bounties, stats, homes, combat log
softdepend: [Geyser-Spigot, floodgate, ViaVersion, ViaBackwards]

commands:
  reset: {description: Reset money and bounty (operators only), usage: /reset}
  tps: {description: Teleport to the server's fixed point, usage: /tps, permission: knightsmp.tps}
  settings: {description: Your personal settings, usage: /settings, permission: knightsmp.settings}
  stat: {description: Show your statistics, usage: "/stat [player]", permission: knightsmp.stat}
  payanim: {description: Turn the payment popup on or off, usage: "/payanim [on/off]", permission: knightsmp.pay}
  sethome: {description: Save your current location as your home, usage: /sethome, permission: knightsmp.home}
  home: {description: Teleport to your home, usage: /home, permission: knightsmp.home}
  deletehome: {description: Delete your saved home, usage: /deletehome, aliases: [delhome], permission: knightsmp.home}
  bounty: {description: Bounty leaderboard, usage: /bounty, permission: knightsmp.bounty}
  money: {description: Show your Dollar balance and wallet, usage: "/money [player]", permission: knightsmp.money}
  pay: {description: Pay Dollars to a player, usage: "/pay <player> <amount>", permission: knightsmp.pay}
  baltop: {description: Richest players, usage: /baltop, permission: knightsmp.baltop}
  moneyadmin: {description: Dollar administration, usage: "/moneyadmin <give/take/set/migrate>", permission: knightsmp.admin.money}
  shop: {description: General shop, usage: /shop, permission: knightsmp.shop}
  shopkits: {description: Kit shop, usage: /shopkits, permission: knightsmp.kits}
  sell: {description: Sell items to the market, usage: /sell, permission: knightsmp.sell}
  knight: {description: KnightSMP admin command, usage: "/knight <reload/setbounty/resetbounty/market>", permission: knightsmp.admin}

permissions:
  knightsmp.tps: {default: true}
  knightsmp.settings: {default: true}
  knightsmp.stat: {default: true}
  knightsmp.stat.others: {default: true}
  knightsmp.home: {default: true}
  knightsmp.bypass.delay: {default: op}
  knightsmp.bounty: {default: true}
  knightsmp.money: {default: true}
  knightsmp.money.others: {default: true}
  knightsmp.pay: {default: true}
  knightsmp.baltop: {default: true}
  knightsmp.shop: {default: true}
  knightsmp.kits: {default: true}
  knightsmp.sell: {default: true}
  knightsmp.bypass.combat: {default: false}
  knightsmp.admin:
    default: op
    children:
      knightsmp.admin.reload: true
      knightsmp.admin.money: true
      knightsmp.admin.setbounty: true
      knightsmp.admin.market: true
