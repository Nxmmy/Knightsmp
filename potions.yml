# Potion shop. Every PotionType the server knows is sold as potion, splash potion and lingering potion
# (generated from the server, so all variants are real, valid potions). price = base x variant x form.
# base = the plain version; LONG_ x long-multiplier (redstone), STRONG_ x strong-multiplier (glowstone);
# splash x splash-multiplier (gunpowder), lingering x lingering-multiplier (dragon's breath: end dragon only).
long-multiplier: 1.5
strong-multiplier: 1.8
splash-multiplier: 1.3
lingering-multiplier: 3.0
default-base: 60   # used (with a console warning) for new potion types
exclude: [WATER, LUCK]   # water bottle is free; Luck is creative-only
prices:
  AWKWARD: 8
  MUNDANE: 8
  THICK: 8
  NIGHT_VISION: 30
  INVISIBILITY: 60
  LEAPING: 55
  FIRE_RESISTANCE: 45
  SWIFTNESS: 25
  SLOWNESS: 30
  WATER_BREATHING: 30
  HEALING: 30
  HARMING: 35
  POISON: 25
  WEAKNESS: 20
  REGENERATION: 70
  STRENGTH: 40
  TURTLE_MASTER: 120
  SLOW_FALLING: 80
  WIND_CHARGED: 90
  WEAVING: 60
  OOZING: 60
  INFESTED: 55
