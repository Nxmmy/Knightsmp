
name: Build Mods For KnightSMP

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract new update ZIP
        run: unzip -o ModsForKnightSMP-update2-gradle-layout.zip -d .

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'

      - name: Build plugin
        run: gradle -p ModsForKnightSMP build --no-daemon

      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: ModsForKnightSMP
          path: ModsForKnightSMP/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
