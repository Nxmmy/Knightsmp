
name: Build KnightSMP Admin Tools

on:
  push:
    paths:
      - 'KnightSMPAdminTools/**'
      - '.github/workflows/admin-tools.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Extract source files
        working-directory: KnightSMPAdminTools
        run: |
          unzip -o src.zip
          rm src.zip

      - name: Build plugin
        working-directory: KnightSMPAdminTools
        run: gradle build --no-daemon

      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: KnightSMPAdminTools
          path: KnightSMPAdminTools/build/libs/*.jar
