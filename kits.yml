      - {material: IRON_CHESTPLATE}
      - {material: IRON_LEGGINGS}
      - {material: IRON_BOOTS}
      - {material: IRON_SWORD}
      - {material: IRON_PICKAXE}
      - {material: IRON_AXE}
      - {material: IRON_SHOVEL}
      - {material: SHIELD}
      - {material: BOW}
      - {material: ARROW, amount: 32}
      - {material: COOKED_BEEF, amount: 32}
