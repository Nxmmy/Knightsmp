      - {material: DIAMOND_HELMET, enchants: {protection: 2, unbreaking: 2}}
      - {material: DIAMOND_CHESTPLATE, enchants: {protection: 2, unbreaking: 2}}
      - {material: DIAMOND_LEGGINGS, enchants: {protection: 2, unbreaking: 2}}
