      - {material: COOKED_BEEF, amount: 64}
      - {material: ENDER_PEARL, amount: 8}

  endgame:
    name: Endgame Kit
    icon: NETHERITE_CHESTPLATE
    description: ["&7Full enchanted Netherite, weapons,", "&7spear (if supported), Elytra and supplies."]
    price: 150
    currency: diamonds
