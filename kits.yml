# Kits. price 0 = free. cooldown-seconds 0 = no cooldown (buy as often as you like).
# Items: material, amount, name (optional), enchants (optional: {name: level}).
# Items whose material does not exist on the server version (e.g. spears) are skipped with a console warning.
kits:
  starter:
    name: Starter Kit
    icon: WOODEN_SWORD
    description: ["&7A small free kit for new players.", "&7Enable it in config.yml: starter-kit.enabled"]
    price: 0
    currency: iron
    cooldown-seconds: 0
    items:
      - {material: WOODEN_SWORD}
      - {material: WOODEN_PICKAXE}
      - {material: BREAD, amount: 8}
      - {material: TORCH, amount: 16}

  beginner:
    name: Beginner Kit
    icon: CHAINMAIL_CHESTPLATE
    description: ["&7Chainmail armor, stone tools", "&7and basic supplies."]
    price: 5
    currency: iron
    cooldown-seconds: 0
    items:
      - {material: CHAINMAIL_HELMET}
      - {material: CHAINMAIL_CHESTPLATE}
      - {material: CHAINMAIL_LEGGINGS}
      - {material: CHAINMAIL_BOOTS}
