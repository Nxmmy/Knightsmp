# Dynamic selling market - all payouts in Dollars ($).
# price = BASE payout per `bundle` units = shop value x 0.35 (min $1). On refresh each item rolls UP/DOWN and its price is multiplied (x0.4 - x2.0),
# so even a x2.0 day pays well below the shop's buy price: buying and re-selling can never make money.
refresh-hours: 24
announce-refresh: true
max-sale-bundles: 64       # most bundles one click can sell
up-chance: 0.5
up-multiplier:   {min: 1.3, max: 2.0}
down-multiplier: {min: 0.4, max: 0.8}
stock:                     # bundles the market will buy per refresh
  up:   {min: 64, max: 256}
  down: {min: 16, max: 96}

