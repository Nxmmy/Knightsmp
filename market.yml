# Dynamic selling market. price = base reward per "bundle" units of the item.
refresh-hours: 24
announce-refresh: true
up-chance: 0.5                  # chance an item is in HIGH demand (price UP) on refresh
up-multiplier:   {min: 1.3, max: 2.0}
down-multiplier: {min: 0.4, max: 0.8}
stock:                          # how many bundles the market will buy per refresh
  up:   {min: 64, max: 256}
  down: {min: 16, max: 96}

categories:
  nature:
    name: Nature
    icon: OAK_SAPLING
