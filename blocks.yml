# Shop pricing rules. EVERY item the running server knows that is a block (and anything matched by a rule with item: true) is listed in the shop
# automatically: the first matching rule gives its category, price per item (unit) and pack size (amount). Pack price = round(unit x amount), minimum $1 (unit 0 = free).
# Blocks matching no rule are not sold (fallback category is empty); set a category there to list them at the fallback price. Anything in shop.yml is skipped here.
# Add or tune rules freely; regexes are matched against the full UPPER_CASE material name.
exclude:
  - '^(AIR|CAVE_AIR|VOID_AIR|BEDROCK|BARRIER|LIGHT|STRUCTURE_BLOCK|STRUCTURE_VOID|JIGSAW|DEBUG_STICK|KNOWLEDGE_BOOK)$'
  - '^.*COMMAND_BLOCK$'
  - '^(END_PORTAL|END_PORTAL_FRAME|END_GATEWAY|NETHER_PORTAL|SPAWNER|TRIAL_SPAWNER|VAULT|REINFORCED_DEEPSLATE|BUDDING_AMETHYST|FARMLAND|PETRIFIED_OAK_SLAB|CHORUS_PLANT|FROGSPAWN|FROSTED_ICE|FIRE|SOUL_FIRE|TEST_BLOCK|TEST_INSTANCE_BLOCK)$'
  - '^INFESTED_.*$'
  - '^SUSPICIOUS_(SAND|GRAVEL)$'
  - '^LEGACY_.*$'
fallback: {category: "", unit: 0, amount: 1}   # empty category = not sold
