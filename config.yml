# Mods For KnightSMP - main configuration
teleport:
  cancel-on-move: true
  cancel-on-damage: true
  back-on-death: true
  block-requests-to-combat-players: false
  # delay = seconds standing still before teleport, cooldown = seconds before reuse (0 = none)
  tpa:   {delay: 3, cooldown: 10, request-expire-seconds: 60}
  home:  {delay: 5, cooldown: 30}
  back:  {delay: 5, cooldown: 30}
  spawn: {delay: 3, cooldown: 30}
  rtp:
    delay: 5
    cooldown: 300
    world: ""            # empty = the player's current world (falls back to the first world if not the Overworld)
    min-radius: 500
    max-radius: 5000
    center-x: 0
    center-z: 0
    attempts: 12

combat:
  enabled: true
  duration-seconds: 30
  punish-timeouts: true  # also punish client timeouts (not server crashes/shutdowns, which fire no combat-logout)
  logout:
    punishment: KILL     # KILL or NONE
    broadcast: true
    commands: []         # console commands, %player% placeholder
  # Commands blocked while combat-tagged (aliases of these commands are resolved too)
  blocked-commands: [tpa, tpahere, tpaccept, home, sethome, back, spawn, rtp, warp, warps, tp, tpr, wild]

bounty:
  enabled: true
  increase-per-kill: 5          # bounty gained by the killer for each valid PvP kill
  max-bounty: 1000000
  reward-currency: iron         # iron or diamonds
  reward-multiplier: 1.0        # reward = victim bounty x this
  # anti-abuse
  max-repeat-kills: 1           # kills between the same two players that count within the window
  repeat-window-seconds: 3600
  block-same-ip: true           # no credit when both players share a (public) IP address
  min-account-age-minutes: 10   # both players must have joined at least this long ago

wanted-role:
  enabled: true
  display: "&5&lKnightSMP - WANTED #1"   # shown as name-tag / tab-list prefix
  min-bounty: 1
  announce: true
  # Optional console commands to hook a permissions plugin (e.g. LuckPerms), %player% placeholder:
  on-gain-commands: []   # e.g. ["lp user %player% parent add wanted"]
  on-lose-commands: []   # e.g. ["lp user %player% parent remove wanted"]

economy:
  # Spending uses the account balance first, then (if true) physical ingots/diamonds in the inventory.
  spend-from-inventory: true
  # How rewards (selling, bounties) are paid: BALANCE = account, INVENTORY = physical items (overflow goes to account)
  payout-mode: BALANCE
  allow-withdraw: true
  withdraw-max: 2304
  gui-withdraw-amount: 64
  max-transaction: 1000000
  balance-cap: 1000000000000

shop:
  max-quantity: 64

starter-kit:
  enabled: false     # give a free kit to brand-new players on first join
  kit: starter       # id from kits.yml

