# Mods For KnightSMP - main configuration (Dollar economy, anarchy edition: /home only, no /tpa /spawn /rtp)

database:
  file: knightsmp.db        # inside the plugin folder; a .bak copy is made before any upgrade or migration

combat:
  enabled: true
  duration-seconds: 30
  punish-timeouts: true     # also punish client timeouts (server crashes/shutdowns and admin kicks never count)
  logout:
    punishment: KILL        # KILL or NONE
    broadcast: true
    commands: []            # console commands, %player% placeholder
  # Commands blocked while combat-tagged. Aliases of these commands (from any plugin) are resolved too.
  blocked-commands: [home]

home:
  delay-seconds: 5          # stand still this long before /home teleports (knightsmp.bypass.delay skips it)
  cancel-on-move: true
  cancel-on-damage: true
  block-in-combat: true     # /home is refused (and a countdown cancelled) while combat-tagged

hud:
  enabled: true             # sidebar with Money / Bounty / Kills. Vanilla only shows the sidebar on the RIGHT side of the screen.
  title: "&5&lKnightSMP"
  lines:                    # placeholders: %money% %bounty% %kills%  (max 8 lines)
    - "&7Money: &a$%money%"
    - "&7Bounty: &c$%bounty%"
    - "&7Kills: &f%kills%"

economy:
  starting-balance: 150     # dollars given ONCE, when a player's account is first created (never again, never to existing accounts)
  max-transaction: 1000000  # largest single /pay or transfer
  balance-cap: 1000000000000
  baltop-size: 10

shop:
  max-quantity: 64          # most packs per purchase

bounty:
  enabled: true
  increase-per-kill: 50     # dollars of bounty the killer gains per valid PvP kill
  max-bounty: 1000000
  reward-multiplier: 1.0    # reward paid = victim's bounty x this
  # anti-abuse (a blocked kill changes nothing: no reward, no bounty change, no reset)
  max-repeat-kills: 1       # kills between the same two players that count within the window
  repeat-window-seconds: 3600
  block-same-ip: true       # no credit when both players share a public IP address
  min-account-age-minutes: 10

wanted-role:
  enabled: true
  display: "&5&lKnightSMP - WANTED #1"   # shown as name-tag / tab-list prefix
  min-bounty: 1
  announce: true
  on-gain-commands: []      # e.g. ["lp user %player% parent add wanted"]
  on-lose-commands: []

stats:
  playtime-flush-minutes: 5   # playtime is saved on quit/shutdown and also every N minutes

payment-animation:           # what the RECEIVER sees when someone pays them
  enabled: true
  gui: true                  # centre popup: your head in a golden ring with rays (skipped in combat or when another menu is open)
  particles: true
  sounds: true
  duration-ticks: 70         # 20 ticks = 1 second, per payment
  max-queue: 5               # payments arriving during an animation wait in line; beyond this they are merged into one summary
  rarities:                  # highest min <= amount wins; players can turn the popup off with /payanim
    - {name: COMMON, min: 1, color: "&f"}
    - {name: UNCOMMON, min: 50, color: "&a"}
    - {name: RARE, min: 250, color: "&9"}
    - {name: EPIC, min: 1000, color: "&5"}
    - {name: LEGENDARY, min: 5000, color: "&6"}

starter-kit:
  enabled: false            # give a free kit to brand-new players on first join
  kit: starter              # id from kits.yml

# Converting OLD Iron/Diamond balances to Dollars.
# Nothing is converted automatically and old balances are never deleted. To convert:
#   1. choose how many Dollars one Iron and one Diamond are worth (whole numbers, 0 allowed) - -1 means "not decided yet"
#   2. /knight reload, then run /moneyadmin migrate (shows a preview), then /moneyadmin migrate confirm
# A backup of the database is written first. Each account converts once only (safe to run again).
# Suggestion based on the shop pricing model: iron_ingot ~ $6-8, diamond ~ $50-63.
migration:
  iron-rate: -1
  diamond-rate: -1

